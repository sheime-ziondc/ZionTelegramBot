# Fly.io deployment. Polling mode needs no public service block; webhook mode does.
app = "zion-translation-bot"
primary_region = "sea"

[build]

[env]
  MODE = "polling"
  ENGINE = "sonnet"
  STATE_FILE = "/data/state.json"
  PORT = "8080"

# Persists chat settings, context and usage counters between deploys.
[mounts]
  source = "bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Polling keeps one machine running; do not let Fly stop it.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
